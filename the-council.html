<title>The Council</title>
<meta name="description" content="Bring two to five contrasting AI-simulated perspectives into one thoughtful council. You host the conversation.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Schibsted+Grotesk:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F1F2ED; --surface:#FFFFFF; --surface-2:#F7F8F4; --sunk:#E9EBE4; --line:#DFE2DA; --line-strong:#C6CBC2;
  --ink:#131715; --ink-2:#39403C; --muted:#5F6862; --faint:#858D88;
  --green:#0E7C5A; --green-ink:#FFFFFF; --green-soft:#E1F0E9; --green-hover:#0A6A4C;
  --brand:#C9522D; --brand-soft:#FBEBE4;
  --chamber:#121614; --chamber-ink:#EEF1EE; --chamber-muted:#9BA59F; --chamber-line:#2A322E;
  --warn-soft:#FFF3D6; --warn-ink:#6E4B00; --err-soft:#FCE8E4; --err-ink:#9C2A16;
  --s0:#0E7C5A; --s1:#C9522D; --s2:#3A62B5; --s3:#87569B; --s4:#A67C12;
  --shadow-sm:0 1px 2px rgba(20,30,25,.06);
  --shadow:0 1px 2px rgba(20,30,25,.05),0 10px 30px rgba(20,30,25,.07);
  --shadow-lg:0 24px 70px rgba(10,20,15,.22);
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"Schibsted Grotesk","Segoe UI",system-ui,-apple-system,sans-serif;
  --ar-serif:"Noto Naskh Arabic","Traditional Arabic",Tahoma,serif;
  --ar-sans:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --r:12px; --r-lg:20px; --ease:cubic-bezier(.2,.7,.2,1);
  --logo-light:block; --logo-dark:none; --av-ink:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1311; --surface:#161B18; --surface-2:#1B211E; --sunk:#0B0E0D; --line:#29312D; --line-strong:#3A4540;
    --ink:#ECEFEC; --ink-2:#C9D0CB; --muted:#9BA49F; --faint:#77817B;
    --green:#3DBE8F; --green-ink:#06130D; --green-soft:#15302A; --green-hover:#55D0A2;
    --brand:#E8805A; --brand-soft:#33211A;
    --chamber:#0A0D0C; --chamber-line:#222a26;
    --warn-soft:#332912; --warn-ink:#F1CD7B; --err-soft:#391C16; --err-ink:#F4A18F;
    --s0:#3DBE8F; --s1:#E8805A; --s2:#7E9FEA; --s3:#C497D8; --s4:#DDB44F;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.3);
    --logo-light:none; --logo-dark:block; --av-ink:#07110C;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1311; --surface:#161B18; --surface-2:#1B211E; --sunk:#0B0E0D; --line:#29312D; --line-strong:#3A4540;
  --ink:#ECEFEC; --ink-2:#C9D0CB; --muted:#9BA49F; --faint:#77817B;
  --green:#3DBE8F; --green-ink:#06130D; --green-soft:#15302A; --green-hover:#55D0A2;
  --brand:#E8805A; --brand-soft:#33211A;
  --chamber:#0A0D0C; --chamber-line:#222a26;
  --warn-soft:#332912; --warn-ink:#F1CD7B; --err-soft:#391C16; --err-ink:#F4A18F;
  --s0:#3DBE8F; --s1:#E8805A; --s2:#7E9FEA; --s3:#C497D8; --s4:#DDB44F;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.3);
  --logo-light:none; --logo-dark:block; --av-ink:#07110C;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink-2);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
[dir="rtl"] body{font-family:var(--ar-sans);font-size:16px}
h1,h2,h3{font-family:var(--serif);font-weight:400;color:var(--ink);letter-spacing:-.012em;text-wrap:balance;margin:0}
[dir="rtl"] h1,[dir="rtl"] h2,[dir="rtl"] h3{font-family:var(--ar-serif);letter-spacing:0;font-weight:600;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:6px}
::selection{background:var(--green-soft)}
.icon{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
[dir="rtl"] .flip{transform:scaleX(-1)}
.label{font-size:12.5px;font-weight:600;color:var(--muted)}
[dir="rtl"] .label{font-size:14px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--brand)}
[dir="rtl"] .eyebrow{letter-spacing:0;font-size:14px}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.logo-light{display:var(--logo-light)} .logo-dark{display:var(--logo-dark)}

/* ===== The Council mark (living logo) ===== */
.mk{display:block;overflow:visible;flex:none}
.mk .s{stroke:var(--mk-ink,var(--ink));transition:opacity .4s var(--ease),stroke .4s,transform .45s var(--ease);transform-box:view-box;transform-origin:50px 50px}
.mk .s.dissent{stroke:var(--brand)}
.mk .dot{fill:var(--green);transform-box:fill-box;transform-origin:center}
.mk .orb{transform-origin:50px 50px}
.mk.idle .orb{animation:orbit 90s linear infinite}
.mk.draw .s{stroke-dasharray:22;stroke-dashoffset:22;animation:draw .75s var(--ease) forwards}
.mk.draw g:nth-child(2) .s{animation-delay:.1s}.mk.draw g:nth-child(3) .s{animation-delay:.2s}.mk.draw g:nth-child(4) .s{animation-delay:.3s}.mk.draw g:nth-child(5) .s{animation-delay:.42s}
.mk.draw .dot{animation:pop .55s .6s var(--ease) both}
.mk.draw.idle .orb{animation:orbit 90s 1.4s linear infinite}
.mk.seating .s{animation:seat 1.8s ease-in-out infinite}
.mk.seating g:nth-child(2) .s{animation-delay:.18s}.mk.seating g:nth-child(3) .s{animation-delay:.36s}.mk.seating g:nth-child(4) .s{animation-delay:.54s}.mk.seating g:nth-child(5) .s{animation-delay:.72s}
.mk.seating .dot{animation:breathe 1.8s ease-in-out infinite}
.mk.thinking .s{opacity:.22}
.mk.thinking .s.on{opacity:1;stroke:var(--seat);animation:reach .9s ease-in-out infinite alternate}
.mk.thinking .dot{animation:breathe 1.2s ease-in-out infinite}
.mk.converge .s{animation:converge 2.2s ease-in-out infinite alternate}
.mk.converge .dot{animation:breathe 2.2s ease-in-out infinite}
.brandmark:hover .mk .s{transform:translateY(-4px)}
.brandmark:hover .mk .dot{transform:scale(1.25)}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes seat{0%,100%{opacity:.25}35%{opacity:1}}
@keyframes breathe{50%{transform:scale(1.35)}}
@keyframes reach{from{transform:translateY(0)}to{transform:translateY(7px)}}
@keyframes converge{from{transform:translateY(0)}to{transform:translateY(10px)}}

/* ===== Buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:999px;padding:9px 16px;font-weight:600;font-size:14px;line-height:1.2;transition:background .15s,border-color .15s,transform .1s,box-shadow .15s;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--green-ink);box-shadow:0 6px 16px color-mix(in srgb,var(--green) 22%,transparent)}
.btn.primary:hover{background:var(--green-hover);border-color:var(--green-hover)}
.btn.ghost{border-color:transparent;background:transparent;box-shadow:none}
.btn.ghost:hover{background:var(--sunk)}
.btn.lg{padding:14px 24px;font-size:15.5px}
.btn.block{width:100%}
.btn.sm{padding:6px 11px;font-size:13px}
.btn[disabled]{opacity:.42;cursor:not-allowed;box-shadow:none}
.btn.icon-only{padding:8px;border-radius:50%}
.link{border:0;background:none;padding:0;color:var(--green);font-weight:600;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:500;color:var(--ink-2);transition:border-color .15s,background .15s}
.chip:hover{border-color:var(--line-strong)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;border-radius:6px;padding:2px 7px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.tag.demo{background:var(--warn-soft);color:var(--warn-ink);border-color:transparent}
.tag.live{background:var(--green-soft);color:var(--green);border-color:transparent}
.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:7px 8px;font-weight:600;font-size:13.5px;color:var(--muted);white-space:nowrap;transition:background .15s,color .15s}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.select,.input,.ta{border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:9px 12px;font-size:14.5px;width:100%}
.select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 55%,calc(100% - 12px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-inline-end:32px}
[dir="rtl"] .select{background-position:17px 55%,12px 55%}
.ta{min-height:72px;resize:vertical}
.input:focus,.ta:focus,.select:focus{border-color:var(--green);outline:none;box-shadow:0 0 0 3px var(--green-soft)}
.field{display:flex;flex-direction:column;gap:7px}
.av{position:relative;display:grid;place-items:center;border-radius:50%;width:48px;height:48px;font-weight:700;font-size:15px;color:var(--av-ink);flex:none;letter-spacing:.02em}
.av .n{position:absolute;bottom:-3px;inset-inline-end:-3px;width:18px;height:18px;border-radius:50%;background:var(--surface);color:var(--ink);font-size:10.5px;display:grid;place-items:center;border:1px solid var(--line-strong)}
.av.sm{width:34px;height:34px;font-size:12.5px}
.av.xs{width:24px;height:24px;font-size:10.5px;border:2px solid var(--surface)}
.c0{background:var(--s0)}.c1{background:var(--s1)}.c2{background:var(--s2)}.c3{background:var(--s3)}.c4{background:var(--s4)}
.stack{display:flex}.stack .av+.av{margin-inline-start:-7px}
.spinner{width:20px;height:20px;border-radius:50%;border:2.5px solid var(--line-strong);border-top-color:var(--green);animation:orbit .8s linear infinite;display:inline-block;flex:none}

/* ===== Splash + Welcome ===== */
.splash{min-height:100dvh;display:grid;place-items:center;gap:14px;align-content:center;text-align:center}
.splash .mk{width:84px;height:84px}
.splash p{margin:0;color:var(--muted);font-size:13.5px}
.welcome{min-height:100dvh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.chamber{background:var(--chamber);color:var(--chamber-ink);padding:44px clamp(28px,5vw,72px);display:flex;flex-direction:column;gap:30px;position:relative;overflow:hidden}
.chamber::before{content:"";position:absolute;width:760px;height:760px;border-radius:50%;border:1px solid var(--chamber-line);inset-inline-end:-340px;top:-200px}
.chamber::after{content:"";position:absolute;width:520px;height:520px;border-radius:50%;border:1px solid var(--chamber-line);inset-inline-end:-220px;top:-80px}
.chamber > *{position:relative;z-index:1}
.chamber .brand-row{display:flex;align-items:center;gap:12px}
.chamber .brand-row .mk{width:34px;height:34px;--mk-ink:var(--chamber-ink)}
.chamber .brand-row b{font-family:var(--serif);font-weight:500;font-size:22px}
[dir="rtl"] .chamber .brand-row b{font-family:var(--ar-serif)}
.hero-mark{width:clamp(120px,15vw,176px);height:clamp(120px,15vw,176px);--mk-ink:var(--chamber-ink);margin-top:auto}
.chamber h1{color:var(--chamber-ink);font-size:clamp(38px,4.6vw,62px);line-height:1.04;max-width:15ch}
[dir="rtl"] .chamber h1{line-height:1.35}
.chamber h1 em{font-style:italic;color:#F08A63}
.how{list-style:none;margin:0;padding:0;display:grid;gap:16px;max-width:480px;counter-reset:how}
.how li{display:grid;grid-template-columns:32px 1fr;gap:14px;align-items:start}
.how li::before{counter-increment:how;content:counter(how);display:grid;place-items:center;width:32px;height:32px;border-radius:50%;border:1px solid var(--chamber-line);color:var(--chamber-ink);font-weight:600;font-size:13px}
.how b{display:block;color:var(--chamber-ink);font-size:15.5px;font-weight:600}
.how span{color:var(--chamber-muted);font-size:14px}
.gate{display:flex;flex-direction:column;justify-content:center;padding:44px clamp(24px,5vw,72px);gap:26px;max-width:600px;width:100%;margin:0 auto}
.gate-top{display:flex;justify-content:flex-end}
.gate h2{font-size:clamp(30px,3vw,40px);line-height:1.1}
.gate .lead{margin:10px 0 0;color:var(--muted);font-size:16px;max-width:44ch}
.who-card{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.who-card img{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:none}
.who-card .gen{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);color:var(--muted);flex:none}
.who-card b{display:block;color:var(--ink);font-size:15.5px}
.who-card small{color:var(--muted);font-size:13px}
.who-card .check{margin-inline-start:auto;color:var(--green)}
.gate .fine{font-size:12.5px;color:var(--faint);display:flex;gap:8px;align-items:flex-start;margin:0}
.gate-actions{display:flex;flex-direction:column;gap:12px}
.gate-actions .alt{font-size:13.5px;color:var(--muted);text-align:center}

/* ===== App header ===== */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.2) blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:1320px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px}
.brandmark{display:flex;align-items:center;gap:10px;color:var(--ink);background:none;border:0;padding:4px 6px 4px 0;border-radius:10px}
.brandmark .mk{width:32px;height:32px}
.brandmark b{font-family:var(--serif);font-weight:500;font-size:21px;letter-spacing:-.01em;white-space:nowrap}
/* brand lockup stays English, logo on the left, in both languages */
[dir="rtl"] .top-in,[dir="rtl"] .top-actions{flex-direction:row-reverse}
[dir="rtl"] .top-actions{margin-inline-start:0;margin-inline-end:auto}
[dir="rtl"] .brandmark{padding:4px 6px 4px 0}
[dir="rtl"] .top .menu-wrap > .menu{inset-inline-end:auto;inset-inline-start:0}
.foot-name{font-weight:600;color:var(--ink-2)}
[dir="rtl"] .foot-name,[dir="rtl"] .brand-eyebrow{font-family:var(--sans)}
[dir="rtl"] .brand-eyebrow{letter-spacing:.09em;font-size:12px}
[dir="rtl"] .welcome{direction:ltr}
[dir="rtl"] .welcome > *{direction:rtl}
.chamber .hero-mark,[dir="rtl"] .chamber .hero-mark{align-self:center}
[dir="rtl"] .chamber .brand-eyebrow{display:block;text-align:left}
.top-actions{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
.mode{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;border-radius:999px;padding:6px 11px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.mode i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.mode.live i{background:var(--green);box-shadow:0 0 0 3px var(--green-soft)} .mode.demo i{background:#D69A1C}
.me-btn{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 8px 3px 3px}
.me-btn img,.me-btn .gen{width:30px;height:30px;border-radius:50%;object-fit:cover;display:grid;place-items:center;background:var(--sunk)}
.me-btn .account-initials{font-size:11px;font-weight:700;color:var(--green);background:var(--green-soft);letter-spacing:.02em}
.menu-wrap{position:relative}
.menu{position:absolute;inset-inline-end:0;top:calc(100% + 8px);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);padding:6px;min-width:250px;z-index:30;animation:rise .16s var(--ease)}
.menu .menu-head{padding:10px 12px 8px;border-bottom:1px solid var(--line);margin-bottom:4px}
.menu .menu-head b{display:block;color:var(--ink);font-size:14.5px;overflow-wrap:anywhere}
.menu .menu-head small{display:block;margin-top:3px;color:var(--muted);font-size:12.5px;line-height:1.45;white-space:normal;overflow-wrap:anywhere;max-width:280px}
.menu button{display:flex;width:100%;align-items:center;gap:10px;border:0;background:none;padding:9px 12px;border-radius:9px;text-align:start;font-size:14px;color:var(--ink-2)}
.menu button:hover{background:var(--sunk)}
.menu button.danger{color:var(--err-ink)}
.menu button .aside{margin-inline-start:auto;color:var(--faint);font-size:12.5px}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
@keyframes rise{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

.wrap{max-width:1320px;margin:0 auto;padding-inline:20px;padding-block:28px 40px}
.view{animation:fadein .35s var(--ease)}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Toasts */
.toasts{position:fixed;inset-inline:0;top:calc(72px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:center;gap:8px;z-index:80;pointer-events:none;padding-inline:16px}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--bg);border-radius:12px;padding:11px 14px 11px 16px;box-shadow:var(--shadow-lg);font-size:14px;max-width:560px;animation:rise .2s var(--ease)}
.toast.err{background:var(--err-ink);color:#fff}
.toast button{border:0;background:none;color:inherit;font-weight:700;padding:2px 4px;text-decoration:underline;text-underline-offset:3px}

/* Stepper */
.steps{display:flex;gap:6px;flex-wrap:wrap;list-style:none;margin:0 0 20px;padding:0}
.steps li{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--faint)}
.steps li+li::before{content:"";width:24px;height:1px;background:var(--line-strong)}
.steps li span{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1px solid var(--line-strong);font-size:11.5px}
.steps li.done{color:var(--muted)} .steps li.done span{background:var(--green-soft);border-color:transparent;color:var(--green)}
.steps li.now{color:var(--ink)} .steps li.now span{background:var(--green);border-color:var(--green);color:var(--green-ink)}

/* ===== Home ===== */
.greet{display:flex;align-items:center;gap:10px;margin:0 0 16px;color:var(--muted);font-size:14.5px}
.greet img{width:26px;height:26px;border-radius:50%}
.home{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:26px;align-items:start}
.home>*,.asm>*,.dl>*{min-width:0}
.ask{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:34px;box-shadow:var(--shadow)}
.ask h1{font-size:clamp(32px,3.6vw,46px);line-height:1.06;margin:0 0 10px}
.ask h1 em{font-style:italic;color:var(--brand)}
.ask .lede{margin:0 0 22px;color:var(--muted);max-width:54ch;font-size:15.5px}
.qbox{border:1.5px solid var(--line-strong);border-radius:16px;background:var(--surface);transition:border-color .15s,box-shadow .15s}
.qbox:focus-within{border-color:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.qbox textarea{display:block;width:100%;min-height:108px;resize:none;border:0;background:transparent;padding:16px 18px 6px;font-size:18px;line-height:1.45;color:var(--ink);outline:none}
.qbox-foot{display:flex;align-items:center;gap:10px;padding:8px 10px 10px 14px;flex-wrap:wrap}
.topic-pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);background:var(--sunk);border-radius:999px;padding:4px 4px 4px 10px}
.topic-pill select{border:0;background:var(--surface);border-radius:999px;padding:3px 8px;font-size:12.5px;font-weight:600;color:var(--ink)}
.qbox-foot .counter{margin-inline-start:auto;font-size:12px;color:var(--faint)}
.opts{margin-top:14px}
.opts>summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:6px 2px;font-size:13.5px;color:var(--muted);font-weight:500}
.opts>summary::-webkit-details-marker{display:none}
.opts>summary b{color:var(--ink);font-weight:600}
.opts>summary .icon{transition:transform .2s;width:16px;height:16px}
.opts[open]>summary .icon{transform:rotate(180deg)}
.opts-body{padding:12px 0 2px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.opts-body .full{grid-column:1/-1}
.ask-cta{margin-top:22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ask-cta small{color:var(--faint);font-size:12.5px}
kbd{font:600 11px/1 var(--sans);border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:5px;padding:2px 5px;color:var(--muted);background:var(--surface-2)}
.ideas{margin-top:30px;padding-top:24px;border-top:1px solid var(--line)}
.ideas-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.ideas-head h2{font-size:21px}
.topics{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}
.idea-list{list-style:none;margin:0;padding:0}
.idea-list button{display:flex;align-items:center;gap:12px;width:100%;text-align:start;border:0;border-bottom:1px solid var(--line);background:none;padding:13px 2px;font-size:15px;font-weight:500;color:var(--ink);transition:color .15s,padding .2s var(--ease)}
.idea-list button:hover{color:var(--green);padding-inline-start:8px}
.idea-list button .icon{margin-inline-start:auto;color:var(--faint)}
.side{display:flex;flex-direction:column;gap:18px}
.resume{background:var(--chamber);color:var(--chamber-ink);border-radius:var(--r-lg);padding:22px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.resume .eyebrow{color:#F08A63}
.resume h3{color:var(--chamber-ink);font-size:21px;line-height:1.25}
.resume .meta{display:flex;align-items:center;gap:10px;color:var(--chamber-muted);font-size:13px}
.resume .bar{background:var(--chamber-line)}
.resume .av.xs{border-color:var(--chamber)}
.resume .btn.primary{align-self:flex-start}
.side-head{display:flex;justify-content:space-between;align-items:baseline}
.side-head h2{font-size:22px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--green)}
.sync.local i{background:var(--faint)} .sync.saving i{background:#D69A1C}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.hist li{display:flex;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);transition:border-color .15s,box-shadow .15s}
.hist li:hover{border-color:var(--line-strong);box-shadow:var(--shadow-sm)}
.hist .open{flex:1;min-width:0;text-align:start;border:0;background:none;padding:13px 16px;display:flex;flex-direction:column;gap:8px}
.hist .open b{color:var(--ink);font-weight:600;font-size:14.5px;line-height:1.35;overflow-wrap:anywhere}
.hist .meta{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:12.5px;color:var(--muted);align-items:center}
.hist .del{border:0;background:none;padding:0 14px;color:var(--faint);border-radius:0 var(--r) var(--r) 0}
.hist .del:hover{color:var(--err-ink);background:var(--err-soft)}
.empty{border:1px dashed var(--line-strong);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--muted);font-size:14px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty .mk{width:40px;height:40px;opacity:.7}
.honesty{font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:flex-start;padding:14px 16px;border-radius:var(--r);background:var(--surface-2);border:1px solid var(--line)}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .4s var(--ease)}
.foot{max-width:1320px;margin:10px auto 0;padding:26px 20px 34px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
.foot .mk{width:26px;height:26px}
/* theme + account */
.menu-row{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 12px;font-size:14px;color:var(--ink-2)}
.menu-row .seg{margin-inline-start:auto}
.seg.icons{flex:none;flex-wrap:nowrap}
.seg.icons button{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;padding:6px 9px}
.seg.icons .icon{width:16px;height:16px}
.menu .seg button{width:auto;padding:5px 9px;border-radius:7px}
.menu .seg button:hover{background:none;color:var(--ink)}
.menu .seg button[aria-pressed="true"]{background:var(--surface)}
.gate-top{gap:10px;flex-wrap:wrap}
.theme-btn{color:var(--muted)} .theme-btn:hover{color:var(--ink)}
html.theme-anim,html.theme-anim *{transition:background-color .3s,color .3s,border-color .3s,fill .3s!important}
.credit{display:inline-flex;align-items:center;gap:7px;color:var(--faint);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;line-height:1;opacity:.85;transition:opacity .2s}
.credit:hover{opacity:1}
[dir="rtl"] .credit{letter-spacing:0;text-transform:none;font-size:12px}
.credit img{height:24px;width:auto}
.foot .credit{margin-inline-start:auto}
.credit-foot{display:flex;justify-content:center;padding:6px 20px 16px}
.gate .credit{align-self:center;margin-top:4px}
.splash{position:relative}
.splash .credit{position:absolute;bottom:24px;left:50%;transform:translateX(-50%)}

/* ===== Assemble ===== */
.page-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;flex-wrap:wrap;margin-bottom:22px}
.page-head h1{font-size:clamp(26px,3vw,36px);line-height:1.15;max-width:32ch}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--muted);font-weight:600;padding:0;margin-bottom:10px;font-size:14px}
.back:hover{color:var(--ink)}
.asm{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:24px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.table-card{padding:18px;position:sticky;top:86px}
.stage{position:relative;width:100%;max-width:480px;aspect-ratio:1;margin:0 auto}
.stage::before{content:"";position:absolute;inset:10%;border-radius:50%;border:1px dashed var(--line-strong)}
.disc{position:absolute;inset:30%;border-radius:50%;background:radial-gradient(circle at 50% 35%,var(--surface),var(--surface-2));border:1px solid var(--line);box-shadow:inset 0 -10px 30px rgba(0,0,0,.04),var(--shadow-sm);display:grid;place-items:center;text-align:center;padding:10px}
.disc .mk{width:44%;height:44%;margin:0 auto}
.disc small{display:block;font-size:12px;color:var(--muted);margin-top:6px}
.seat{position:absolute;transform:translate(-50%,-50%);width:124px;display:flex;flex-direction:column;align-items:center;gap:5px;border:0;background:none;padding:6px;border-radius:14px;text-align:center;transition:background .2s}
.seat.arrive{animation:seatin .55s var(--ease) both}
@keyframes seatin{from{opacity:0;transform:translate(-50%,-50%) scale(.6)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.seat:hover .av,.seat.hl .av{box-shadow:0 0 0 4px var(--green-soft)}
.seat.hl{background:var(--surface-2)}
.seat b{font-size:13px;line-height:1.2;color:var(--ink);font-weight:600}
.seat small{font-size:11.5px;color:var(--faint);line-height:1.2}
.seat.empty-seat .av{background:transparent;border:1.5px dashed var(--line-strong);color:var(--faint)}
.table-note{text-align:center;font-size:13px;color:var(--muted);margin:8px 0 0}
.picks{padding:24px}
.picks-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.picks-head h2{font-size:23px}
.pick{display:flex;gap:14px;padding:15px 12px;margin-inline:-12px;border-radius:14px;align-items:flex-start;transition:background .15s}
.pick:hover,.pick:focus-within{background:var(--surface-2)}
.pick+.pick{border-top:1px solid var(--line)}
.pick-main{flex:1;min-width:0}
.pick-main .nm{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.pick-main b{color:var(--ink);font-size:15.5px}
.pick-main .why{margin:5px 0 0;font-size:14px;color:var(--ink-2)}
.pick-main details{margin-top:6px;font-size:13.5px;color:var(--muted)}
.pick-main summary{cursor:pointer;font-weight:600;color:var(--green);font-size:13px;list-style:none;display:inline-flex;gap:4px;align-items:center}
.pick-main summary::-webkit-details-marker{display:none}
.pick-main details p{margin:6px 0 0}
.runs{margin-top:16px;padding:18px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
.runs h3{font-size:17px}
.runs .row{display:grid;grid-template-columns:140px 1fr;gap:12px;align-items:center}
.accept{margin-top:18px;display:flex;flex-direction:column;gap:8px}
.accept small{color:var(--faint);font-size:12.5px;text-align:center}
.loading-picks{padding:8px 0 4px;color:var(--muted);display:flex;flex-direction:column;gap:12px}
.skel{height:64px;border-radius:14px;background:linear-gradient(90deg,var(--surface-2),var(--sunk),var(--surface-2));background-size:200% 100%;animation:shimmer 1.4s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}

/* ===== Discussion ===== */
.dl{display:grid;grid-template-columns:300px minmax(0,1fr);gap:22px;align-items:start}
.discussion-actions{display:flex;align-items:center;gap:12px 18px;flex-wrap:wrap;margin:0 0 18px;padding:12px 15px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2)}
.discussion-actions-buttons{display:flex;gap:8px;flex-wrap:wrap}
.discussion-actions-note,.discussion-actions-status{margin:0;color:var(--muted);font-size:12.5px;line-height:1.45}
.discussion-actions-note{flex:1 1 260px}
.discussion-actions-status{flex:1 1 100%;padding-top:9px;border-top:1px solid var(--line);color:var(--warn-ink)}
.discussion-actions .btn .icon{width:16px;height:16px}
.discussion-personal-label{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--muted);font-size:12px;font-weight:600;line-height:1.35}
.discussion-actions [data-discussion-open-room]{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:7px 11px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink-2);font-size:13px;font-weight:600;line-height:1.25;text-decoration:none;transition:background .15s,border-color .15s}
.discussion-actions [data-discussion-open-room]:hover{border-color:var(--line-strong);background:var(--surface-2)}
.discussion-actions [hidden]{display:none!important}
.side-panel{position:sticky;top:86px;padding:20px;display:flex;flex-direction:column;gap:16px;max-height:calc(100dvh - 110px);overflow-y:auto}
.panel-toggle{display:none}
.panel-details{display:contents}
.side-panel h1{font-size:20px;line-height:1.3}
.people{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.people button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:7px 8px;border-radius:12px;text-align:start;transition:background .15s}
.people button:hover{background:var(--surface-2)}
.people button.next{background:var(--green-soft)}
.people .pn{min-width:0;flex:1}
.people .pn b{display:block;font-size:14px;color:var(--ink);font-weight:600;line-height:1.25}
.people .pn small{display:block;font-size:12px;color:var(--muted);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.speaking-dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:breathe 1.1s ease-in-out infinite}
.progress-row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:6px}
.pins h3{font-size:15px;font-family:var(--sans);font-weight:600;color:var(--ink);margin-bottom:6px;display:flex;align-items:center;gap:6px}
[dir="rtl"] .pins h3{font-family:var(--ar-sans)}
.pins ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.pins li{font-size:13px;background:var(--brand-soft);border-radius:10px;padding:8px 10px;display:flex;gap:8px;align-items:flex-start}
.pins li span{flex:1;min-width:0}
.pins li b{color:var(--ink)}
.pins li button{border:0;background:none;color:var(--muted);padding:0}
.side-panel .fine{font-size:12px;color:var(--faint);margin:0}
.convo{display:flex;flex-direction:column;height:calc(100dvh - 86px - 28px - 42px);min-height:540px;overflow:hidden}
.convo-head{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line)}
.convo-head .mk{width:30px;height:30px}
.convo-head h2{font-size:19px}
.convo-head .status{font-size:12.5px;color:var(--muted)}
.convo-head .count{margin-inline-start:auto;font-size:13px;color:var(--muted);white-space:nowrap}
.msgs{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:18px;scroll-behavior:smooth}
.msg{display:flex;gap:12px;align-items:flex-start;max-width:78ch;position:relative}
.msg .body{min-width:0;flex:1}
.msg .who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:3px}
.msg .who b{color:var(--ink);font-size:14.5px}
.msg .who small{color:var(--faint);font-size:12px}
.msg .text{color:var(--ink-2);font-size:15.5px;line-height:1.65;overflow-wrap:anywhere}
.msg.persona .text{padding-inline-start:14px;border-inline-start:2px solid var(--seat,var(--line))}
.msg.pinned .text{background:var(--brand-soft);border-radius:0 10px 10px 0;padding-block:6px}
[dir="rtl"] .msg.pinned .text{border-radius:10px 0 0 10px}
.msg-actions{display:flex;gap:4px;margin-top:6px;opacity:0;transition:opacity .15s}
.msg:hover .msg-actions,.msg:focus-within .msg-actions{opacity:1}
@media (hover:none){.msg-actions{opacity:1}}
.msg-actions button{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600;color:var(--muted)}
.msg-actions button:hover{color:var(--ink);border-color:var(--line-strong)}
.msg-actions button[aria-pressed="true"]{color:var(--brand);border-color:var(--brand)}
.msg-actions .icon{width:14px;height:14px}
.msg.host{align-self:flex-end;flex-direction:row-reverse}
.msg.host .text{background:var(--ink);color:var(--bg);padding:10px 15px;border-radius:16px 16px 4px 16px}
[dir="rtl"] .msg.host .text{border-radius:16px 16px 16px 4px}
.msg.host .who{justify-content:flex-end}
.msg.mod{max-width:none;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:14px 16px;gap:12px}
.msg.mod .mk{width:28px;height:28px;margin-top:2px}
.msg.mod .text{font-size:14.5px}
.msg.event{align-self:center;font-size:12.5px;color:var(--muted);background:var(--surface-2);padding:5px 12px;border-radius:99px;border:1px solid var(--line)}
.round-sep{display:flex;align-items:center;gap:12px;color:var(--faint);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
[dir="rtl"] .round-sep{letter-spacing:0;font-size:13px}
.round-sep::before,.round-sep::after{content:"";flex:1;height:1px;background:var(--line)}
.hostav{width:34px;height:34px;border-radius:50%;background:var(--sunk);color:var(--ink);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;overflow:hidden}
.hostav img{width:100%;height:100%;object-fit:cover}
.thinking{display:inline-flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
.typing{display:inline-flex;gap:4px}.typing i{width:6px;height:6px;border-radius:50%;background:var(--seat,var(--muted));animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.nudge{align-self:stretch;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:1px solid var(--green);background:var(--green-soft);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--ink)}
.nudge .btn{margin-inline-start:auto}
.composer{border-top:1px solid var(--line);padding:12px 16px 14px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.comp-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.comp-row .btn.primary{flex:1 1 220px;min-width:0}
.comp-row .btn.primary .next-name{font-weight:500;opacity:.9;overflow:hidden;text-overflow:ellipsis}
.inputbar{display:flex;gap:8px;align-items:flex-end;border:1px solid var(--line-strong);border-radius:16px;padding:6px 6px 6px 8px;background:var(--surface);transition:border-color .15s,box-shadow .15s}
.inputbar:focus-within{border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.inputbar select{border:0;background:var(--sunk);border-radius:9px;padding:7px 8px;font-size:13px;max-width:160px;align-self:center;font-weight:600}
.inputbar textarea{flex:1;border:0;resize:none;min-height:38px;max-height:140px;padding:8px 4px;font-size:15px;background:transparent;outline:none;color:var(--ink)}
.send{border:0;border-radius:11px;background:var(--green);color:var(--green-ink);width:38px;height:38px;display:grid;place-items:center;flex:none}
.send[disabled]{opacity:.35;cursor:not-allowed}
.hint{font-size:12px;color:var(--faint)}
.host-response-hint{display:block;color:var(--muted);font-size:12px;line-height:1.4;padding-inline:5px}
.backup-tools{display:flex;flex-direction:column;gap:7px;margin-top:-8px}
.backup-actions{display:flex;flex-wrap:wrap;gap:7px}
.backup-tools>small{color:var(--faint);font-size:11.5px;line-height:1.4}
.backup-privacy{margin:0 0 18px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);color:var(--ink-2);font-size:13.5px}
.backup-result{margin:12px 0 0;min-height:1.5em;color:var(--green);font-size:13.5px}
.backup-result:not(:empty){padding:9px 11px;border-radius:10px;background:var(--green-soft)}
.steer-menu{bottom:calc(100% + 8px);top:auto;inset-inline-start:0;inset-inline-end:auto}

/* ===== Overlays ===== */
.scrim{position:fixed;inset:0;background:rgba(8,12,10,.5);z-index:50;display:grid;place-items:center;padding:16px;animation:fade .18s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);width:min(760px,100%);max-height:min(88dvh,900px);display:flex;flex-direction:column;overflow:hidden;animation:rise .22s var(--ease)}
.modal.wide{width:min(1180px,100%);height:min(88dvh,860px)}
.drawer-scrim{place-items:stretch end}
[dir="rtl"] .drawer-scrim{place-items:stretch start}
.drawer{background:var(--surface);width:min(720px,100%);height:100%;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);border-radius:var(--r-lg);overflow:hidden;animation:slide .3s var(--ease)}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
[dir="rtl"] .drawer{animation-name:slide-rtl}
@keyframes slide-rtl{from{transform:translateX(-40px);opacity:0}}
.m-head{display:flex;align-items:flex-start;gap:14px;padding:20px 22px 14px;border-bottom:1px solid var(--line)}
.m-head .mk{width:40px;height:40px}
.m-head h2{font-size:25px;line-height:1.2}
.m-head p{margin:4px 0 0;font-size:13.5px;color:var(--muted)}
.m-head .x{margin-inline-start:auto}
.m-body{flex:1;overflow-y:auto;padding:22px}
.m-foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:12px 22px;border-top:1px solid var(--line);background:var(--surface-2)}
.m-foot .left{margin-inline-end:auto}
.md h2{font-size:21px;margin:24px 0 8px}
.md h3{font-size:18px;margin:18px 0 6px}
.md h2:first-child,.md h3:first-child{margin-top:0}
.md p{margin:0 0 10px}
.md p:last-child{margin-bottom:0}
.md ul,.md ol{margin:0 0 10px;padding-inline-start:22px}
.md li{margin:3px 0}
.md strong{color:var(--ink)}
.brief h2{display:flex;align-items:center;gap:10px;font-size:20px;padding-top:18px;border-top:1px solid var(--line)}
.brief h2:first-child{padding-top:0;border-top:0}
.brief h2:first-child + p{font-family:var(--serif);font-size:20px;line-height:1.45;color:var(--ink)}
[dir="rtl"] .brief h2:first-child + p{font-family:var(--ar-serif)}
.tbl{overflow-x:auto;margin:6px 0 12px}
.tbl table{border-collapse:collapse;font-size:14px;min-width:100%}
.tbl th,.tbl td{border:1px solid var(--line);padding:7px 10px;text-align:start;vertical-align:top}
.tbl th{background:var(--surface-2);color:var(--ink)}

/* Library */
.lib{display:grid;grid-template-columns:minmax(0,1fr) 380px;flex:1;min-height:0}
.lib-left{display:flex;flex-direction:column;min-height:0;border-inline-end:1px solid var(--line)}
.lib-filters{display:flex;gap:8px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line)}
.lib-filters .search{flex:1 1 240px;position:relative}
.lib-filters .search .icon{position:absolute;inset-inline-start:11px;top:50%;transform:translateY(-50%);color:var(--faint)}
.lib-filters .search input{padding-inline-start:36px}
.lib-filters .select{width:auto;flex:0 1 auto}
.lib-scroll{flex:1;overflow-y:auto;padding:4px 18px 18px}
.lib-section{display:flex;justify-content:space-between;align-items:center;padding:14px 0 8px;font-size:13px;color:var(--muted);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.pcard{text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-height:112px;transition:border-color .15s,box-shadow .15s,transform .15s}
.pcard:hover{border-color:var(--line-strong);transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.pcard[aria-pressed="true"]{border-color:var(--green);box-shadow:0 0 0 2px var(--green-soft)}
.pcard.sug{background:var(--surface-2)}
.pcard .dom{font-size:11.5px;color:var(--brand);font-weight:600}
.pcard b{color:var(--ink);font-size:14.5px;line-height:1.3}
.pcard small{font-size:12.5px;color:var(--muted);line-height:1.35}
.pcard .seated{margin-top:auto;font-size:11.5px;color:var(--green);font-weight:600}
.detail{display:flex;flex-direction:column;min-height:0}
.detail-body{flex:1;overflow-y:auto;padding:20px}
.detail-body h3{font-size:25px;margin:4px 0}
.detail-body .ar{font-family:var(--ar-serif);color:var(--muted);font-size:16px}
.detail-body dl{margin:14px 0 0;display:flex;flex-direction:column;gap:12px}
.detail-body dt{font-size:12.5px;font-weight:600;color:var(--muted)}
.detail-body dd{margin:2px 0 0;font-size:14px}
.detail-foot{padding:14px 20px;border-top:1px solid var(--line)}
.lib-seats{display:flex;gap:6px;overflow-x:auto;padding:10px 18px;border-top:1px solid var(--line);background:var(--surface-2)}
.lib-seats span{flex:none;font-size:12.5px;padding:5px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--muted);white-space:nowrap}
.lib-seats span.cur{border-color:var(--green);color:var(--ink);font-weight:600}
.custom-form{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.mobile-back{display:none}

/* ===== Responsive ===== */
@media (max-width:1040px){
  .welcome{grid-template-columns:1fr}
  .chamber{padding:28px 22px 30px;gap:20px}
  .hero-mark{margin-top:0;width:88px;height:88px}
  .chamber .how{display:none}
  .gate{padding:28px 22px 40px}
  .home,.asm,.dl{grid-template-columns:1fr}
  .table-card,.side-panel{position:static;max-height:none}
  .lib{grid-template-columns:1fr}
  .lib .detail{display:none}
  .lib.show-detail .lib-left{display:none}
  .lib.show-detail .detail{display:flex}
  .mobile-back{display:inline-flex}
  .side-panel .people{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:2px}
  .side-panel .people li{flex:none}
  .side-panel .people button{border:1px solid var(--line);padding:5px 12px 5px 5px;max-width:230px}
  .side-panel .people .pn small{display:none}
  .side-panel .fine,.side-panel .desk-only{display:none}
  .convo{height:calc(100dvh - 72px - 42px);min-height:500px}
}
@media (max-width:640px){
  .wrap{padding-inline:16px;padding-block:18px 28px}
  .top-in{padding:8px 16px;gap:8px}
  .top-actions{gap:4px}
  .top-actions>.btn{padding-inline:10px}
  .top-actions .icon-only{padding-inline:0}
  .top-actions .me-btn{padding:3px}
  .brandmark{gap:6px;padding-inline:0}
  .brandmark .mk{width:28px;height:28px}
  /* Friends stays in the account menu; keep Live rooms visible in the header. */
  .top-actions > [data-shares-open],.top-actions > [data-friends-open],.top-actions > .theme-btn{display:none}
  .mode,.new-text,.me-btn>.icon{display:none}
  .brandmark b{font-size:18px}
  .ask{padding:20px}
  .qbox textarea{font-size:16.5px}
  .opts-body{grid-template-columns:1fr}
  .runs .row{grid-template-columns:1fr;gap:6px}
  .seat{width:86px} .seat small{display:none} .seat b{font-size:11.5px}
  .av{width:40px;height:40px;font-size:13px}
  .msgs{padding:14px}
  .composer{padding:10px 12px 12px}
  .inputbar select{max-width:96px}
  .hint{display:none}
  .m-head,.m-body{padding-inline:16px}
  .steps li+li::before{width:10px}
  .drawer{border-radius:var(--r-lg) var(--r-lg) 0 0}
  .drawer-scrim{padding:40px 0 0;place-items:stretch}
  .discussion-actions{align-items:stretch;padding:12px;gap:10px}
  .discussion-actions-buttons{display:grid;grid-template-columns:1fr 1fr;width:100%}
  .discussion-actions-buttons .btn{white-space:normal;min-height:42px;padding-inline:10px}
  .discussion-actions [data-discussion-open-room]{min-height:44px}
  .discussion-actions-buttons .btn,.top-actions .btn,.top-actions .me-btn{min-height:44px;min-width:44px}
  .discussion-actions-note{flex-basis:100%}
}
@media (max-width:767px){
  .side-panel{padding:10px 12px;gap:0;overflow:visible}
  .panel-toggle{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;border:0;background:none;color:var(--ink);text-align:start;padding:5px 2px;font-weight:600;font-size:13.5px}
  .panel-toggle>span{display:flex;align-items:center;gap:9px}
  .panel-toggle>.icon{width:16px;height:16px;transition:transform .18s}
  .panel-open .panel-toggle>.icon{transform:rotate(180deg)}
  .panel-details{display:flex;flex-direction:column;gap:12px;padding:10px 0 4px}
  .panel-collapsed .panel-details{display:none}
  .side-panel .people{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin;padding:3px 1px 7px}
  .side-panel .people li{flex:0 0 250px;min-width:250px;max-width:250px}
  .side-panel .people button{max-width:none;width:100%;align-items:flex-start;padding:8px 9px}
  .side-panel .people .pn{overflow-wrap:normal;word-break:normal}
  .side-panel .people .pn b{font-size:13.5px;white-space:normal;line-height:1.3}
  .side-panel .people .pn small{display:block;white-space:normal;overflow:visible;text-overflow:clip;font-size:11.5px;line-height:1.35}
  .side-panel .people .order{flex:none}
  .inputbar{gap:5px;padding-inline:6px}
  .inputbar textarea{min-width:0;font-size:15.5px;line-height:1.45}
  .inputbar .to-chip{max-width:120px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
}

/* ===== v4: modes ===== */
.modes-wrap{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.modes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.mode-card{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:start;border:1px solid var(--line);background:var(--surface-2);border-radius:14px;padding:11px 12px;transition:border-color .15s,background .15s,box-shadow .15s}
.mode-card .icon{color:var(--muted);width:20px;height:20px;margin-bottom:2px}
.mode-card b{color:var(--ink);font-size:14px}
.mode-card small{color:var(--muted);font-size:12px;line-height:1.35}
.mode-card:hover{border-color:var(--line-strong);background:var(--surface)}
.mode-card[aria-checked="true"]{border-color:var(--green);background:var(--green-soft);box-shadow:0 0 0 1px var(--green) inset}
.mode-card[aria-checked="true"] .icon{color:var(--green)}
/* featured / most seated */
.featured{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 16px 10px;box-shadow:var(--shadow-sm)}
.feat-head{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
.feat-head h2{font-size:19px}
.feat-head .muted{font-size:12.5px}
.feat-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.feat{display:flex;align-items:center;gap:12px;padding:10px 2px;border-top:1px solid var(--line)}
.feat:first-child{border-top:0}
.feat .av{width:40px;height:40px;font-size:13px}
.feat-txt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.feat-txt b{color:var(--ink);font-size:14.5px}
.feat-txt small{color:var(--muted);font-size:12px}
.feat-tag{font-size:12.5px;color:var(--ink-2);font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feat .btn{flex:none}
.feat.on{background:var(--green-soft);border-radius:12px;padding-inline:8px}
.preseat{display:flex;align-items:center;gap:8px;background:var(--green-soft);color:var(--ink);border-radius:10px;padding:6px 6px 6px 12px;font-size:13.5px}
.preseat .icon{color:var(--green);width:16px;height:16px}
.preseat span{flex:1}
.seen-at{display:flex;flex-direction:column;gap:8px;max-width:480px}
.seen-at > span{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--chamber-muted)}
[dir="rtl"] .seen-at > span{letter-spacing:0;font-size:13px}
.seen-at > div{display:flex;flex-wrap:wrap;gap:6px}
.seen-at b{font-weight:600;font-size:13px;color:var(--chamber-ink);border:1px solid var(--chamber-line);border-radius:99px;padding:5px 11px}
@media (max-width:640px){ .feat-tag{display:none} .feat .btn .icon + *{display:inline} }
/* featured row (horizontal, above the question box) */
.feat-row{display:flex;align-items:center;gap:12px;margin:0 0 14px;flex-wrap:wrap}
.feat-row-label{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand);white-space:nowrap}
[dir="rtl"] .feat-row-label{letter-spacing:0;font-size:13px}
.feat-row-label .icon{width:14px;height:14px}
.feat-chips{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.feat-chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface-2);border-radius:99px;padding:3px 11px 3px 3px;text-align:start;transition:border-color .15s,background .15s,transform .1s}
[dir="rtl"] .feat-chip{padding:3px 3px 3px 11px}
.feat-chip:hover{border-color:var(--green);transform:translateY(-1px)}
.feat-chip .av.xs{width:26px;height:26px;font-size:10px;border:0}
.feat-chip .av.xs .icon{width:14px;height:14px}
.fc-txt{display:flex;flex-direction:column;line-height:1.15}
.fc-txt b{font-size:12.5px;color:var(--ink);font-weight:600;white-space:nowrap}
.fc-txt small{font-size:10.5px;color:var(--muted);white-space:nowrap}
.feat-chip.on{border-color:var(--green);background:var(--green-soft)}
@media (max-width:640px){ .feat-chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;width:100%} .feat-chips::-webkit-scrollbar{display:none} .feat-chip{flex:none} }
/* website account sign-in */
.auth-form{display:flex;flex-direction:column;gap:10px}
.auth-form .input{font-size:16px;padding:12px 14px;border-radius:12px}
.auth-err{display:flex;gap:8px;align-items:flex-start;margin:0;padding:9px 12px;border-radius:10px;background:var(--err-soft);color:var(--err-ink);font-size:13.5px}
.auth-err .icon{width:16px;height:16px;margin-top:2px}
.recovery-code-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:14px 0}
.recovery-code-list code{display:block;padding:10px 8px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);text-align:center;font-size:13px;letter-spacing:.04em;user-select:all}
.recovery-warning{margin:0;padding:11px 13px;border-radius:10px;background:var(--warn-soft);color:var(--warn-ink);font-size:13px;line-height:1.5}
.recovery-secret{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
@media(max-width:480px){.recovery-code-list{grid-template-columns:1fr}}
.gate .alt.center{text-align:center;font-size:13.5px;color:var(--muted)}
.gate .alt button.link{font-size:inherit}
.gate .auth-policy{font-size:12px;color:var(--faint)}
.spinner.sm{width:16px;height:16px;border-width:2px;border-top-color:currentColor}
.quota{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--green);background:var(--green-soft);border-radius:99px;padding:5px 11px}
.quota .icon{width:14px;height:14px}
.quota.out{color:var(--warn-ink);background:var(--warn-soft)}
.who-card small[data-quota-text]{color:var(--green);font-weight:600}
/* session setup: always visible, smart dropdowns */
.setup{margin-top:16px;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--surface-2);display:flex;flex-direction:column;gap:12px}
.setup-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.setup-head .label{color:var(--ink);font-size:13.5px}
.setup-hint{font-size:12px;color:var(--faint)}
.setup-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.dd.wide{grid-column:1/-1}
.pick-btn{width:100%;display:flex;align-items:center;gap:10px;text-align:start;border:1px solid var(--line-strong);background:var(--surface);border-radius:12px;padding:9px 12px;min-height:58px;transition:border-color .15s,box-shadow .15s}
.pick-btn:hover{border-color:var(--ink-2)}
.pick-btn[aria-expanded="true"]{border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.pick-ic{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--green-soft);color:var(--green);flex:none}
.pick-txt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.pick-txt small{font-size:11.5px;color:var(--muted);font-weight:600}
.pick-txt b{color:var(--ink);font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick-txt em{font-style:normal;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick-chev{color:var(--muted);transition:transform .2s}
.pick-btn[aria-expanded="true"] .pick-chev{transform:rotate(180deg)}
.dd-menu{inset-inline-start:0;inset-inline-end:auto;min-width:100%;width:max-content;max-width:min(380px,calc(100vw - 32px))}
.dd.end .dd-menu{inset-inline-start:auto;inset-inline-end:0}
.dd-menu button{align-items:flex-start;padding:10px 12px}
.dd-menu button > .icon{margin-top:2px;color:var(--muted)}
.dd-menu button[aria-selected="true"]{background:var(--green-soft)}
.dd-menu button[aria-selected="true"] > .icon{color:var(--green)}
.dd-menu button[aria-selected="true"]::after{align-self:center}
.opt-txt{display:flex;flex-direction:column;min-width:0;flex:1}
.opt-txt b{color:var(--ink);font-size:14px;font-weight:600}
.opt-txt small{color:var(--muted);font-size:12.5px;white-space:normal}
.opt-num{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--sunk);font-size:12px;font-weight:700;color:var(--ink);flex:none;margin-top:1px}
.ctx-field .ta{min-height:60px;background:var(--surface)}
.opt-tag{font-weight:500;color:var(--faint);font-size:11.5px;margin-inline-start:4px}
@media (max-width:640px){ .setup{padding:12px} .setup-hint{display:none} .pick-btn{padding:8px 10px;gap:8px} .pick-ic{width:28px;height:28px} .dd:not(.wide) .pick-ic{display:none} .pick-txt small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis} }
/* compact composer: more room for the conversation */
.composer{padding:8px 12px 10px!important;gap:6px!important}
.comp-row{gap:6px}
.comp-row .btn{padding:7px 12px;font-size:13.5px}
.comp-row .btn .icon{width:16px;height:16px}
.split > .caret{padding-inline:8px}
.suggest{padding:5px 10px!important;font-size:13px!important;border-radius:10px!important;gap:8px!important}
.suggest span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.suggest .icon{width:15px;height:15px}
.inputbar{padding:3px 4px 3px 6px!important;border-radius:13px!important;gap:6px!important}
.inputbar textarea{min-height:32px!important;padding:6px 4px!important;font-size:14.5px!important}
.send{width:32px!important;height:32px!important;border-radius:9px!important}
.to-chip{padding:5px 8px!important;font-size:12.5px!important}
.sum-mode{display:inline-flex;align-items:center;gap:5px}
.sum-mode .icon{width:15px;height:15px;color:var(--green)}
.opts>summary .sum-mode .icon{transform:none!important}
.modes.compact{grid-template-columns:1fr!important;gap:6px;overflow:visible!important;padding-bottom:0!important}
.modes.compact .mode-card{flex-direction:row;align-items:center;gap:10px;padding:9px 12px;border-radius:12px}
.modes.compact .mode-card .icon{margin:0;width:18px;height:18px}
.modes.compact .mode-card b{min-width:92px}
.modes.compact .mode-card small{font-size:12.5px}
@media (max-width:640px){ .modes.compact .mode-card{flex-wrap:wrap} .modes.compact .mode-card small{flex-basis:100%;padding-inline-start:28px} }
.hist-search{position:relative}
.hist-search .icon{position:absolute;inset-inline-start:11px;top:50%;transform:translateY(-50%);color:var(--faint)}
.hist-search input{padding-inline-start:36px}

/* ===== v4: stance meter ===== */
.meter{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line)}
.meter-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.meter-head b{color:var(--ink);font-size:13.5px}
.agree{font-size:12px;color:var(--muted)}
.agree span{font-weight:700;color:var(--green);font-variant-numeric:tabular-nums}
.track{position:relative;height:calc(30px + (var(--lanes) - 1) * 24px);margin:6px 12px 0;border-radius:99px}
.track::before{content:"";position:absolute;inset-inline:0;top:14px;height:3px;border-radius:99px;background:linear-gradient(90deg,var(--s1),var(--line-strong) 50%,var(--s0))}
[dir="rtl"] .track::before{background:linear-gradient(-90deg,var(--s1),var(--line-strong) 50%,var(--s0))}
.tick{position:absolute;top:10px;width:1px;height:11px;background:var(--line-strong)}
.tick:nth-child(1){inset-inline-start:0}.tick:nth-child(2){inset-inline-start:25%}.tick:nth-child(3){inset-inline-start:50%}.tick:nth-child(4){inset-inline-start:75%}.tick:nth-child(5){inset-inline-start:100%}
.mdot{position:absolute;top:calc(3px + var(--lane) * 24px);transform:translateX(-50%);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:var(--av-ink);font-size:9.5px;font-weight:700;border:2px solid var(--surface-2);transition:inset-inline-start .6s var(--ease),top .4s var(--ease);box-shadow:var(--shadow-sm)}
[dir="rtl"] .mdot{transform:translateX(50%)}
.mdot.dis{outline:2px dashed var(--brand);outline-offset:2px}
.mv{position:absolute;top:-5px;inset-inline-end:-6px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:1px solid var(--line-strong)}
.mv::after{content:"";position:absolute;inset:2px;background:var(--ink);clip-path:polygon(50% 10%,90% 70%,10% 70%)}
.mv.down::after{clip-path:polygon(10% 30%,90% 30%,50% 90%)}
.axis{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);font-weight:600}
.stance{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:99px;padding:2px 8px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.stance i{width:6px;height:6px;border-radius:50%;background:var(--faint)}
.stance.pos{background:var(--green-soft);color:var(--green)} .stance.pos i{background:var(--green)}
.stance.neg{background:var(--brand-soft);color:var(--brand)} .stance.neg i{background:var(--brand)}

/* ===== v4: chair recap, suggestion, addressee ===== */

<script>/* The Council browser-only discussion backup format. Classic-script compatible. */
(function (root) {
  "use strict";
  const MAX_BYTES = 10 * 1024 * 1024;
  const MAX_DISCUSSIONS = 1000;
  // Built-in persona IDs include compact catalogue keys such as RT-0001.
  const ID = /^[A-Za-z0-9_-]{1,100}$/;
  const MODES = new Set(["explore", "decide", "stress", "brainstorm", "debate"]);
  const SESSION_KEYS = new Set([
    "id", "preseat", "question", "context", "topic", "mode", "goal", "lang", "count", "style",
    "length", "rounds", "religious", "seats", "reasons", "customs", "pins", "checks", "followups",
    "messages", "turn", "stage", "synthesis", "pickedBy", "createdAt", "updatedAt", "hostDraft",
    "to", "nextPid", "suggest", "synthDemo", "example", "demo", "touched", "statsSent"
  ]);
  const MESSAGE_KEYS = new Set([
    "id", "type", "text", "pid", "round", "gap", "stance", "position", "ask", "counted",
    "demo", "interrupted", "to"
  ]);
  const PERSONA_KEYS = new Set(["id", "type", "name", "ar", "domain", "sub", "tagline", "brief", "worldview", "values", "gender"]);
  const fail = (code, index) => ({ ok: false, error: code, index });
  function cleanText(value, max, optional = false) {
    if (optional && value == null) return true;
    // Discussion content is plain text, including code examples and angle
    // brackets. The app's esc()/inline()/md() escape it when rendering.
    return typeof value === "string" && value.length <= max;
  }
  function validateDiscussion(s) {
    if (!s || typeof s !== "object" || Array.isArray(s)) return "shape";
    if (Object.keys(s).some(k => !SESSION_KEYS.has(k))) return "unknown";
    if (typeof s.id !== "string" || !ID.test(s.id)) return "id";
    if (s.preseat != null && s.preseat !== "" && (typeof s.preseat !== "string" || !ID.test(s.preseat))) return "shape";
    if (!cleanText(s.question, 600) || s.question.trim().length < 1) return "question";
    for (const k of ["context", "topic", "goal", "style", "length", "religious", "synthesis", "hostDraft", "suggest"]) {
      if (s[k] != null && !cleanText(s[k], k === "synthesis" ? 120000 : 4000, true)) return "text";
    }
    if (!MODES.has(s.mode) || !["en", "ar"].includes(s.lang) ||
        !Number.isInteger(s.count) || s.count < 2 || s.count > 5 ||
        !Number.isInteger(s.rounds) || s.rounds < 1 || s.rounds > 8 ||
        !Number.isInteger(s.turn) || s.turn < 0 || s.turn > 400 ||
        !["assemble", "discuss"].includes(s.stage) ||
        !Number.isFinite(s.createdAt) || !Number.isFinite(s.updatedAt)) return "shape";
    if (!Array.isArray(s.seats) || s.seats.length < (s.stage === "assemble" ? 0 : 2) || s.seats.length > 5 ||
        s.seats.some(x => typeof x !== "string" || !ID.test(x)) || new Set(s.seats).size !== s.seats.length) return "seats";
    if (!Array.isArray(s.customs) || s.customs.length > 50) return "personas";
    const customIds = new Set();
    for (const p of s.customs) {
      if (!p || typeof p !== "object" || Array.isArray(p) || Object.keys(p).some(k => !PERSONA_KEYS.has(k)) ||
          typeof p.id !== "string" || !ID.test(p.id) || customIds.has(p.id) || p.type !== "custom" ||
          !cleanText(p.name, 100) || !p.name.trim()) return "personas";
      customIds.add(p.id);
      for (const k of ["ar", "domain", "sub", "tagline", "brief", "worldview", "values", "gender"])
        if (p[k] != null && !cleanText(p[k], 4000, true)) return "personas";
    }
    if (s.seats.some(id => !/^RT-\d{4}$/.test(id) && !customIds.has(id))) return "personas";
    if (!Array.isArray(s.messages) || s.messages.length > 20000) return "messages";
    const messageIds = new Set();
    for (const m of s.messages) {
      if (!m || typeof m !== "object" || Array.isArray(m) || Object.keys(m).some(k => !MESSAGE_KEYS.has(k)) ||
          typeof m.id !== "string" || !ID.test(m.id) || messageIds.has(m.id) ||
          !["host", "persona", "mod", "event", "recap"].includes(m.type) || !cleanText(m.text, 120000)) return "messages";
      messageIds.add(m.id);
      if (m.pid != null && (typeof m.pid !== "string" || !ID.test(m.pid))) return "messages";
      if (m.to != null && m.to !== "all" && (typeof m.to !== "string" || !ID.test(m.to))) return "messages";
      if (m.round != null && (!Number.isInteger(m.round) || m.round < 1 || m.round > 8)) return "messages";
      if (m.stance != null && (typeof m.stance !== "number" || !Number.isFinite(m.stance) || m.stance < -2 || m.stance > 2)) return "messages";
      if (m.gap != null && (!Array.isArray(m.gap) || m.gap.length !== 2 ||
          m.gap.some(id => typeof id !== "string" || !ID.test(id)))) return "messages";
      for (const k of ["position", "ask"])
        if (m[k] != null && !cleanText(m[k], 4000, true)) return "messages";
      for (const k of ["counted", "demo", "interrupted"])
        if (m[k] != null && typeof m[k] !== "boolean") return "messages";
    }
    if (!Array.isArray(s.pins) || s.pins.length > s.messages.length || s.pins.some(id => typeof id !== "string" || !messageIds.has(id)) ||
        new Set(s.pins).size !== s.pins.length) return "pins";
    if (!Array.isArray(s.followups) || s.followups.length > 30 || s.followups.some(x => !cleanText(x, 2000))) return "brief";
    if (s.checks != null && (!s.checks || typeof s.checks !== "object" || Array.isArray(s.checks) ||
        Object.keys(s.checks).length > 500 || Object.values(s.checks).some(v => typeof v !== "boolean"))) return "brief";
    if (s.reasons != null && (!s.reasons || typeof s.reasons !== "object" || Array.isArray(s.reasons) ||
        Object.keys(s.reasons).length > 100 || Object.values(s.reasons).some(v => !v || typeof v !== "object" || Array.isArray(v) ||
          Object.keys(v).some(k => !["why", "position"].includes(k)) ||
          Object.values(v).some(x => !cleanText(x, 4000))))) return "shape";
    for (const k of ["synthDemo", "example", "demo", "touched", "statsSent"])
      if (s[k] != null && typeof s[k] !== "boolean") return "shape";
    if (s.pickedBy != null && !["ai", "quick", ""].includes(s.pickedBy)) return "shape";
    if (s.to != null && s.to !== "all" && (typeof s.to !== "string" || !ID.test(s.to))) return "shape";
    if (s.nextPid != null && s.nextPid !== "" && (typeof s.nextPid !== "string" || !ID.test(s.nextPid))) return "shape";
    return "";
  }
  function validateBackup(data, rawSize) {
    if (rawSize != null && rawSize > MAX_BYTES) return fail("too_large");
    if (!data || typeof data !== "object" || Array.isArray(data) || data.format !== "the-council-backup" ||
        Object.keys(data).some(k => !["format", "version", "exportedAt", "discussions"].includes(k)) ||
        data.version !== 1 || typeof data.exportedAt !== "string" || data.exportedAt.length > 40 ||
        !Number.isFinite(Date.parse(data.exportedAt)) || !Array.isArray(data.discussions)) return fail("format");
    if (data.discussions.length > MAX_DISCUSSIONS) return fail("capacity");
    const seen = new Set();
    for (let i = 0; i < data.discussions.length; i++) {
      const reason = validateDiscussion(data.discussions[i]);
      if (reason) return fail(reason, i);
      if (seen.has(data.discussions[i].id)) return fail("duplicate", i);
      seen.add(data.discussions[i].id);
    }
    return { ok: true, discussions: data.discussions.map(s => JSON.parse(JSON.stringify(s))) };
  }
  function merge(existing, imported) {
    const valid = validateBackup(imported);
    if (!valid.ok) return { ...valid, discussions: existing.slice(), restored: 0, skipped: 0 };
    const base = Array.isArray(existing) ? existing : [];
    const known = new Set(base.map(s => s && s.id).filter(Boolean));
    const additions = valid.discussions.filter(s => !known.has(s.id));
    const skipped = valid.discussions.length - additions.length;
    if (base.length + additions.length > MAX_DISCUSSIONS)
      return { ...fail("capacity"), discussions: base.slice(), restored: 0, skipped: 0 };
    return { ok: true, discussions: [...additions, ...base], restored: additions.length, skipped };
  }
  function exportBackup(discussions, exportedAt) {
    const data = { format: "the-council-backup", version: 1, exportedAt: exportedAt || new Date().toISOString(), discussions };
    const result = validateBackup(data);
    if (!result.ok) throw Object.assign(new Error(result.error), { code: result.error, index: result.index });
    const json = JSON.stringify(data, null, 2);
    if (typeof TextEncoder !== "undefined" && new TextEncoder().encode(json).length > MAX_BYTES)
      throw Object.assign(new Error("too_large"), { code: "too_large" });
    return json;
  }
  const api = { MAX_BYTES, MAX_DISCUSSIONS, validateBackup, validateDiscussion, merge, exportBackup };
  root.COUNCIL_BACKUPS = api;
  if (typeof globalThis !== "undefined") globalThis.COUNCIL_BACKUPS = api;
})(typeof window !== "undefined" ? window : globalThis);</script>

 founder.", "What does this decision look like to our shareholders in five years, not five quarters? Who exactly bears the downside risk if this bet fails? How does this choice affect the customer, the people doing the work, and the resources needed to sustain it?", "RT-0001; RT-0285; RT-0033", "Corporate strategy; governance; stakeholder capitalism; risk management; leadership succession; Organizational priorities; Stakeholder trade-offs", "", "Male", "Business; Leadership & Management; Economics & Finance; Society & Culture; Politics & Governance", "Corporate Leadership; Organizational priorities; Stakeholder trade-offs", ""], ["RT-0003", "Chief Financial Officer (CFO)", "المديرة المالية التنفيذية", "Archetype", "Economics & Finance", "Finance Leadership", "Contemporary", "Global corporate", "Every idea is great until it meets the cash flow statement.", "Guardian of the company's capital, financial controls, and forecasting discipline. Translates ambition into numbers and tells the room when the numbers don't work. Council contribution: applies this perspective to organizational priorities and stakeholder trade-offs.", "Believes that strategy without a funding plan is just a wish, and that cash discipline is what lets a company survive long enough for good strategy to pay off. Sees rigorous forecasting and scenario planning as protection against both euphoria and panic.", "Quantitative and scenario-based: stress-tests every proposal against best-case, base-case, and worst-case cash positions before endorsing it.", "Can undervalue investments whose payoff is qualitative or long-horizon (brand, culture, R&D) because they resist clean quantification; risk of becoming the institutional 'no' by reflex.", "Discipline; transparency; capital efficiency; downside protection", "Precise, calm, unemotional even when delivering bad news.", "None", "Argues that growth funded by unsustainable burn is a countdown clock, not a strategy; that every initiative needs an owner accountable for its ROI; and that healthy skepticism of rosy projections is a form of care for the whole organization, not pessimism.", "What does this cost us if it takes twice as long and returns half as much? Which line item are we willing to cut if this bet doesn't pay off on schedule? How does this choice affect the customer, the people doing the work, and the resources needed to sustain it?", "RT-0001; RT-0004; RT-0006", "Financial planning; capital allocation; risk management; M&A; cost discipline vs. growth investment; Organizational priorities; Stakeholder trade-offs", "", "Female", "Economics & Finance; Business; Leadership & Management; Psychology & Human Behavior", "Finance Leadership; Organizational priorities; Stakeholder trade-offs", ""], ["RT-0004", "Chief Marketing Officer (CMO)", "المديرة التنفيذية للتسويق", "Archetype", "Business", "Marketing & Brand", "Contemporary", "Global corporate", "A product nobody hears about might as well not exist.", "Owns how the company is perceived in the market: brand, demand generation, and the emotional story customers tell themselves about why they buy. Council contribution: applies this perspective to organizational priorities and stakeholder trade-offs.", "Believes that in a crowded market, differentiation is more often a matter of perception and story than of a marginally better feature. Sees brand equity as a real, defensible asset, not decoration on top of the 'real' product. Believes customer insight should shape the product, not just describe it after the fact.", "Blends data (funnel metrics, attribution, cohort behavior) with qualitative customer insight and narrative instinct; comfortable holding both a spreadsheet and a gut feeling about what will resonate.", "Can overvalue attention and buzz relative to durable customer value; marketing spend ROI is genuinely harder to prove than other departments', which invites both real scrutiny and unfair blame.", "Customer empathy; brand consistency; creativity under measurement; storytelling discipline", "Persuasive, image-conscious, fluent in both data and story.", "None", "Argues that cutting brand investment to hit a quarterly number is borrowing against future growth; that the product team's definition of 'done' often ignores how a customer actually discovers and understands value; and that positioning is a strategic decision, not a creative afterthought.", "If a customer describes us to a friend in one sentence, what do we want that sentence to be? Are we solving an awareness problem or a trust problem right now? How does this choice affect the customer, the people doing the work, and the resources needed to sustain it?", "RT-0003; RT-0005; RT-0010", "Branding; positioning; customer experience; advertising ethics; growth marketing; Organizational priorities; Stakeholder trade-offs", "", "Female", "Business; Media & Communication; Psychology & Human Behavior; Economics & Finance; Leadership & Management", "Marketing & Brand; Organizational priorities; Stakeholder trade-offs", ""], ["RT-0005", "Management Consultant", "استشاري إدارة الأعمال", "Archetype", "Business", "Strategy Consulting", "Contemporary", "Global corporate", "There is a framework for that, and here is the slide.", "An outside advisor brought in to diagnose a business problem with structured frameworks, benchmark data, and a clear recommendation deck, then move on to the next client. Council contribution: applies this perspective to organizational priorities and stakeholder trade-offs.", "Believes most business problems, however they present, decompose into a smaller number of recurring patterns that structured analysis can reveal. Sees outside perspective and freedom from internal politics as genuinely valuable, not just a fee justification. Trusts benchmarking against comparable companies as a fast way to find the gap between current and best practice.", "Structured problem-solving: breaks an ambiguous problem into a issue tree, hypothesizes an answer early, then tests it against data before finalizing a recommendation.", "Can underweight the messy human and political realities that make textbook recommendations hard to implement; incentive to recommend engagements that create more consulting work; risk of pattern-matching a unique situation to the wrong precedent.", "Rigor; objectivity; pattern recognition; client-focused pragmatism", "Polished, structured, confident, comfortable presenting to executives.", "None", "Argues that unstructured urgency ('we need to just decide') often masks an unclear problem definition; that comparing yourself to best-in-class peers exposes blind spots insiders can't see; and that implementation discipline, not the brilliance of the strategy, usually determines whether a plan succeeds.", "What decision are we actually trying to enable with this analysis? If we benchmarked the top three players in this space, where would we rank and why? How does this choice affect the customer, the people doing the work, and the resources needed to sustain it?", "RT-0001; RT-0007; RT-0010", "Corporate strategy; organizational design; operational efficiency; market entry; Organizational priorities; Stakeholder trade-offs", "", "Male", "Business; Leadership & Management; Economics & Finance; Psychology & Human Behavior; Education", "Strategy Consulting; Organizational priorities; Stakeholder trade-offs", ""], ["RT-0006", "Venture Capitalist", "مستثمر رأس مال جريء", "Archetype", "Economics & Finance", "Investment", "Contemporary", "Global corporate", "Ninety percent of these fail; I only need the one that works.", "Invests other people's capital into early-stage companies in exchange for equity, betting on outsized returns from a small fraction of a large portfolio. Council contribution: applies this perspective to organizational priorities and stakeholder trade-offs.", "Believes venture returns follow a power law: almost all the fund's return comes from one or two enormous winners, so the job is to avoid ruling out anything that could be that outlier. Sees the founding team's ambition and adaptability as more predictive of success than the current business plan.", "Probabilistic and portfolio-based: doesn't need any single bet to be safe, only the overall portfolio to contain enough huge winners to cover the losses.", "Portfolio-level thinking can be cold comfort to a founder whose single company is everything they have; can push founders toward growth-at-all-costs strategies that don't fit every business; overrepresented in networks that already resemble the VC's own background.", "Asymmetric upside; founder backing; pattern recognition across markets; portfolio thinking", "Confident, pattern-matching, occasionally blunt about a company's odds.", "None", "Argues that playing it safe is often the riskiest strategy for a venture-backed company, since a slow, steady business rarely returns the fund; that market timing and team quality matter more than a flawless initial plan; and that most failures come from running out of ambition or cash, not from a single bad decision.", "If this works, how big does it actually get — and is that big enough to matter? What would have to be true about the market for this bet to be right? How does this choice affect the customer, the people doing the work, and the resources needed to sustain it?", "RT-0003; RT-0007; RT-0033", "Startup investing; risk and return; innovation ecosystems; founder-investor dynamics; Organizational priorities; Stakeholder trade-offs", "", "Male", "Economics & Finance; Business; Leadership & Management; Science & Technology; Psychology & Human Behavior", "Investment; Organizational priorities; Stakeholder trade-offs", ""], ["RT-0007", "Family Business Owner", "صاحبة شركة عائلية", "Archetype", "Business", "Family & SME Enterprise", "Contemporary", "MENA / Levant SME tradition", "This business carries my father's name; I won't gamble it.", "Runs a business built by a parent or grandparent, balancing modernization
